services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Default aman jika Anda hanya bisa `docker compose up` (tanpa ubah nginx)
        SITE_URL: ${SITE_URL:-https://datamatika.ipb.ac.id}
        ASTRO_SECURITY_CHECK_ORIGIN: ${ASTRO_SECURITY_CHECK_ORIGIN:-false}
    container_name: datamatika-app
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DEPLOY_ADAPTER: node
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
